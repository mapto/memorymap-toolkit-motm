{% extends "mmt_map/base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Concepts</h1>
    <input type="text" id="concept-search" class="form-control mb-3" placeholder="Search concepts…">
    <table class="table table-striped" id="concept-table">
        <thead>
            <tr>
                <th>Concept</th>
                <th>Quotes</th>
            </tr>
        </thead>
        <tbody>
            {% for concept in concepts %}
            <tr>
                <td><a href="{% url 'concept_detail' concept.pk %}">{{ concept.label|default:"–" }}</a></td>
                <td>{{ concept.relates_to_concept.count }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No concepts found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    var input = document.getElementById("concept-search");
    var rows = document.querySelectorAll("#concept-table tbody tr");
    input.addEventListener("input", function () {
        var query = this.value.toLowerCase();
        rows.forEach(function (row) {
            var text = row.textContent.toLowerCase();
            row.style.display = text.includes(query) ? "" : "none";
        });
    });
});
</script>
{% endblock %}
