{% extends "mmt_map/base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Locations</h1>
    <input type="text" id="locations-filter" class="form-control mb-2" placeholder="Filter locations…">
    <table class="table table-sm table-striped table-hover" id="locations-table">
        <thead>
            <tr>
                <th style="cursor:pointer" data-sort="name">Name <span class="sort-arrow"></span></th>
                <th style="cursor:pointer" data-sort="region">Region <span class="sort-arrow"></span></th>
                <th style="cursor:pointer" data-sort="events">Events <span class="sort-arrow"></span></th>
            </tr>
        </thead>
        <tbody>
            {% for location in locations %}
            <tr>
                <td><a href="{% url 'location_detail' location.pk %}">{{ location.current_name }}</a></td>
                <td>{% if location.region %}{{ location.region }}{% endif %}</td>
                <td data-value="{{ location.event_count }}">{{ location.event_count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var table = document.getElementById('locations-table');
    if (!table) return;
    var headers = table.querySelectorAll('th[data-sort]');
    var tbody = table.querySelector('tbody');
    var currentSort = null;
    var currentDir = 1;

    headers.forEach(function(th) {
        th.addEventListener('click', function() {
            var col = th.cellIndex;
            if (currentSort === col) { currentDir *= -1; }
            else { currentSort = col; currentDir = 1; }

            headers.forEach(function(h) { h.querySelector('.sort-arrow').textContent = ''; });
            th.querySelector('.sort-arrow').textContent = currentDir === 1 ? ' \u25B2' : ' \u25BC';

            var rows = Array.from(tbody.querySelectorAll('tr'));
            rows.sort(function(a, b) {
                var aVal = a.cells[col].getAttribute('data-value') || a.cells[col].textContent.trim().toLowerCase();
                var bVal = b.cells[col].getAttribute('data-value') || b.cells[col].textContent.trim().toLowerCase();
                if (a.cells[col].hasAttribute('data-value')) {
                    return (parseInt(aVal) - parseInt(bVal)) * currentDir;
                }
                return aVal.localeCompare(bVal) * currentDir;
            });
            rows.forEach(function(r) { tbody.appendChild(r); });
        });
    });

    // Filter
    var filterInput = document.getElementById('locations-filter');
    filterInput.addEventListener('input', function() {
        var q = this.value.toLowerCase();
        Array.from(tbody.querySelectorAll('tr')).forEach(function(row) {
            row.style.display = row.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
        });
    });
})();
</script>
{% endblock %}
