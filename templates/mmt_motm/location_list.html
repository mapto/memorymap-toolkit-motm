{% extends "mmt_map/base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Places</h1>
    <input type="text" id="location-search" class="form-control mb-3" placeholder="Filter places…">
    <div id="word-cloud" style="line-height:2.2;text-align:center;">
        {% for location in locations %}
        <a href="{% url 'location_detail' location.pk %}"
           class="cloud-word d-inline-block mx-1"
           data-count="{{ location.event_count }}"
           data-label="{{ location.current_name|lower }}"
           style="text-decoration:none;">
            {% if location.dominant_icon %}
                <i class="fas {{ location.dominant_icon }}"></i>
            {% endif %}
            {{ location.current_name }}
            <small class="text-muted">({{ location.event_count }})</small>
        </a>
        {% empty %}
        <p>No places found.</p>
        {% endfor %}
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    var words = document.querySelectorAll(".cloud-word");
    var counts = Array.from(words).map(function(w) { return parseInt(w.dataset.count) || 0; });
    var maxCount = Math.max.apply(null, counts) || 1;
    var minCount = Math.min.apply(null, counts) || 0;
    var minSize = 0.85, maxSize = 3.0;
    words.forEach(function(w) {
        var c = parseInt(w.dataset.count) || 0;
        var ratio = maxCount > minCount ? (c - minCount) / (maxCount - minCount) : 0.5;
        var size = minSize + ratio * (maxSize - minSize);
        w.style.fontSize = size.toFixed(2) + "rem";
    });

    var input = document.getElementById("location-search");
    input.addEventListener("input", function () {
        var query = this.value.toLowerCase();
        words.forEach(function (w) {
            w.style.display = w.dataset.label.includes(query) ? "" : "none";
        });
    });
});
</script>
{% endblock %}
